seed: 42
dados:
  batch_size: 64

# Hiperparâmetros do modelo
modelo:
  filtros_bloco1: 32
  filtros_bloco2: 64
  neuronios_densa: 128

# Hiperparâmetros de treino (valem para os três experimentos)
# Valores *provisórios* de partida:
treino:
  otimizador: adam   # "adam" ou "sgd" (em minúsculas)
  lr: 0.001          # taxa de aprendizado
  epocas: 20

# Hiperparâmetros da parada antecipada
parada:
  patience: 3
  delta: 0
  verbose: True

# Tarefa binária
# Cada lado é uma Lista de nomes de classes; mais de um nome forma uma composição.
# Nomes válidos: T-shirt/top, Trouser, Pullover, Dress, Coat, Sandal, Shirt,
# Sneaker, Bag, Ankle boot.
# classe_0 recebe o rótulo 0 e classe_1 recebe o rótulo 1.
binario:
  classe_0: ["T-shirt/top"]
  classe_1: ["Shirt"]        # par difícil (formas parecidas)
  # Exemplos para trocar:
  #   par fácil:   classe_0: ["Trouser"]  classe_1: ["Bag"]
  #   composição:  classe_0: ["T-shirt/top", "Pullover", "Coat", "Shirt"]
  #                classe_1: ["Sandal", "Sneaker", "Ankle boot"]
